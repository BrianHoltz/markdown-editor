    <link rel="stylesheet" href="{{service}}{{resources}}vditor/style.css?{{serverToken}}"/>

                    Donate: <a href="https://shuzijun.com/donate.html" target="_blank">donate</a>

            </ul>

    </div>
</div>
<div id="donate" style="display:none;">
    <svg class="icon" viewBox="0 0 1024 1024" version="1.1" xmlns="http://www.w3.org/2000/svg" width="32" height="32">
        <path d="M881.664 132.096c-69.632-69.632-167.936-97.28-263.168-75.776-22.528 5.12-35.84 26.624-30.72 49.152s26.624 35.84 49.152 30.72c67.584-15.36 137.216 4.096 186.368 53.248C926.72 292.864 926.72 460.8 823.296 563.2L512 875.52 199.68 564.224c-102.4-103.424-102.4-271.36 0-373.76 77.824-77.824 204.8-77.824 282.624 0l69.632 69.632c8.192 8.192 77.824 76.8 150.528 76.8h5.12c30.72-1.024 57.344-15.36 77.824-39.936 14.336-17.408 11.264-43.008-6.144-57.344-17.408-14.336-43.008-11.264-57.344 6.144-6.144 8.192-12.288 9.216-17.408 10.24-26.624 2.048-70.656-29.696-93.184-53.248L541.696 133.12c-109.568-109.568-288.768-109.568-399.36 0C7.168 268.288 7.168 487.424 142.336 622.592L483.328 962.56c8.192 8.192 18.432 12.288 28.672 12.288 10.24 0 20.48-4.096 28.672-12.288l340.992-340.992c65.536-65.536 101.376-152.576 101.376-244.736 0-92.16-35.84-179.2-101.376-244.736z"></path>
        <path d="M240.64 233.472c-33.792 30.72-50.176 76.8-50.176 136.192 0 22.528 18.432 40.96 40.96 40.96s40.96-18.432 40.96-40.96c0-34.816 8.192-60.416 23.552-74.752 18.432-17.408 44.032-16.384 46.08-16.384 22.528 2.048 41.984-15.36 44.032-37.888 2.048-22.528-15.36-41.984-37.888-44.032-7.168-1.024-63.488-4.096-107.52 36.864z"></path>
    </svg>
</div>
</body>
<script>
    $.ajaxSettings.async = false;
    const userTemplate = "{{userTemplate}}" === "true";
    const fileUrl = "{{service}}markdownFile?file={{filePath}}&projectUrl={{projectUrl}}&projectName={{projectName}}&{{serverToken}}";
    const uploadUrl = "{{service}}uploadFile?file={{filePath}}&projectUrl={{projectUrl}}&projectName={{projectName}}&{{serverToken}}";
    const exportUrl = "{{service}}exportFile?file={{filePath}}&projectUrl={{projectUrl}}&projectName={{projectName}}&{{serverToken}}";
    const vditorCDN = "{{service}}{{resources}}vditor";
    const vditorThemeCDN = userTemplate ? "{{service}}assets/vditor/content-theme" : vditorCDN + "/dist/css/content-theme";
    let initError = true;
    let fileValue = "";
    let saveTime = 0;
    let externalRefreshTimer = null;
    let externalRefreshInFlight = false;
    let externalRefreshPending = false;
    let darcula = "{{darcula}}" === "true";
    let ideaThemeReady = false;
    const appearance = {
        toolbarHidden: "{{toolbarHidden}}" === "true",
        rawHtmlHidden: "{{rawHtmlHidden}}" === "true"
    };
    let refreshHtmlOnlyRows = () => {};

    window.onload = function () {
        if (userTemplate) {
            $('<link>').appendTo('head').attr({
                type: 'text/css',
                rel: 'stylesheet',
                href: '{{service}}assets/vditor/userStyle.css'
            });
        }
        appendSyncedTip(!initError);
        if (initError) vditor.tip("Unable to load file. Use Reload to retry; saving is disabled.", 0);
        vditor.vditor.toolbar.elements.export.querySelectorAll(".vditor-hint")[0].innerHTML = "<button onclick='exportFile(\"pdf\")'>PDF</button>\n<button onclick='exportFile(\"html\")'>HTML</button>"
        let infoHtml = vditor.vditor.toolbar.elements.info.querySelectorAll('button')[0].outerHTML;
        vditor.vditor.toolbar.elements.info.querySelectorAll('button')[0].remove()
        vditor.vditor.toolbar.elements.info.innerHTML = infoHtml;
        vditor.vditor.toolbar.elements.info.querySelectorAll('button')[0].onclick = function () {
            vditor.vditor.tip.show(document.getElementById("editorInfo").innerHTML, 0);
        };
        document.addEventListener('mousedown', (event) => {
            if (event.button === 2) {
                if (window.getSelection().isCollapsed) {
                    document.onselectstart =function(){
                        return false;
                    }
                    setTimeout(() => {
                        document.onselectstart =function(){
                            return true;
                        }
                    }, 0);
                }
            }
        });
        initAppearance();
        initResponsiveToolbar();
        initLinkEditing();
        /*const contentMenuStyle = document.getElementById("contentMenu").style;
        const notepad = document.getElementsByClassName("vditor-content")[0];
        notepad.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            contentMenuStyle.top =  e.clientY+ "px";
            contentMenuStyle.left = e.clientX + "px";
            contentMenuStyle.display = "block"
            contentMenuStyle.opacity = "1";
        }, false);
        notepad.addEventListener('click', function(e) {
            contentMenuStyle.opacity = "0";
            setTimeout(function() {
                contentMenuStyle.display = "none";
            }, 501);
        }, false);*/
    }

    function editBlur(md,format) {
        if (initError) {
            vditor.tip("Get init file request error,Don't save.", 1000);
            return;
        }
        if (!format && md === fileValue) {
            return;
        }
        updateSyncState("saving");
        $.post(fileUrl, {"value": md}, function (data) {
            if (data.success === false) {
                updateSyncState("failed");
                vditor.tip("Failed to save file:" + data.message, 0);
            } else {
                fileValue = md;
                syncedTip(true, data)
                saveTime = 0;
            }
        }).fail(function () {
            updateSyncState("failed");
            vditor.tip("Save file request error", 0);
        })
    }

    function editFocus() {
        if (initError || vditor.getValue() !== fileValue) return;
        if (Date.now() <= saveTime) {
            clearTimeout(externalRefreshTimer);
            externalRefreshTimer = setTimeout(editFocus, saveTime - Date.now() + 1);
            return;
        }
        if (externalRefreshInFlight) {
            externalRefreshPending = true;
            return;
        }
        const baseline = fileValue;
        externalRefreshInFlight = true;
        $.ajax({url: fileUrl, async: true, cache: false, success(data) {
            // A response must not replace typing or a save completed since this read began.
            if (fileValue !== baseline || vditor.getValue() !== baseline || data === baseline) return;
            const x = window.scrollX, y = window.scrollY;
            vditor.setValue(data);
            fileValue = vditor.getValue();
            window.scrollTo(x, y);
            syncedTip(true, fileValue);
        }}).always(function () {
            externalRefreshInFlight = false;
            if (externalRefreshPending) {
                externalRefreshPending = false;
                clearTimeout(externalRefreshTimer);
                externalRefreshTimer = setTimeout(editFocus, 75);
            }
        });
    }

    function editInput(md) {
        syncedTip(false, md)
    }

    function initValue() {
        let value = "";
        $.get(fileUrl, function (data) {
            value = data;
            initError = false;
        }).fail(function () {
            // Vditor is not constructed yet. Keep errors out of document content.
            initError = true;
        })
        return value;
    }

    function appendSyncedTip(isSynced) {
        const synced = document.createElement("div");
        synced.className = "vditor-toolbar__item markdown-sync-state";
        synced.id = "syncedTip";
        const button = document.createElement("button");
        button.type = "button";
        button.className = "markdown-save-button";
        button.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 3h13l4 4v14H3V3zm3 2v6h10V5zm0 10v4h10v-4zM13 6h2v4h-2z" fill="currentColor"/></svg>';
        button.addEventListener("pointerdown", (event) => event.preventDefault());
        button.addEventListener("click", () => editBlur(vditor.getValue(), true));
        synced.appendChild(button);

        const reloadItem = document.createElement("div");
        reloadItem.className = "vditor-toolbar__item";
        reloadItem.id = "reloadTip";
        const reloadButton = document.createElement("button");
        reloadButton.type = "button";
        reloadButton.className = "markdown-reload-button";
        reloadButton.title = "Reload from disk";
        reloadButton.setAttribute("aria-label", reloadButton.title);
        reloadButton.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z" fill="currentColor"/></svg>';
        reloadButton.addEventListener("pointerdown", (event) => event.preventDefault());
        reloadButton.addEventListener("click", reloadFile);
        reloadItem.appendChild(reloadButton);

        vditor.vditor.toolbar.element.prepend(reloadItem);
        vditor.vditor.toolbar.element.prepend(synced);
        updateSyncState(isSynced ? "saved" : "unsaved");
    }

    let reloadArmed = false;
    let reloadArmTimer = null;

    function reloadFile() {
        if (vditor.getValue() !== fileValue) {
            if (!reloadArmed) {
                reloadArmed = true;
                vditor.tip("Unsaved changes — click reload again to discard them", 3000);
                clearTimeout(reloadArmTimer);
                reloadArmTimer = setTimeout(() => {
                    reloadArmed = false;
                }, 3000);
                return;
            }
            reloadArmed = false;
            clearTimeout(reloadArmTimer);
        }
        $.get(fileUrl, function (data) {
            initError = false;
            vditor.setValue(data);
            fileValue = vditor.getValue();
            saveTime = 0;
            syncedTip(true, data);
        }).fail(function () {
            vditor.tip("Get file request error", 0);
        })
    }

    function updateSyncState(state) {
        const synced = document.getElementById("syncedTip");
        if (!synced) {
            return;
        }
        synced.className = "vditor-toolbar__item markdown-sync-state markdown-sync-state--" + state;
        const button = synced.querySelector("button");
        const labels = {
            saved: "Saved on disk",
            saving: "Saving changes",
            failed: "Save failed — click to retry",
            unsaved: "Unsaved changes — click to save"
        };
        button.title = labels[state];
        button.setAttribute("aria-label", button.title);
        button.setAttribute("aria-busy", String(state === "saving"));
    }

    function syncedTip(isSynced, md) {
        if (!initError && (isSynced || md === fileValue)) {
            updateSyncState("saved");
        } else {
            updateSyncState("unsaved");
        }

    }

    function exportFile(type) {
        let options = {
            mode: "light",
            anchor: 2,
            lang: vditor.vditor.options.lang,
            hljs: vditor.vditor.options.preview.hljs,
            speech: {enable: false},
            math: vditor.vditor.options.preview.math,
            cdn: vditor.vditor.options.cdn,
            markdown: vditor.vditor.options.preview.markdown,
            theme: vditor.vditor.options.preview.theme,
            icon: vditor.vditor.options.icon
        }
        options.theme.current = "idea-light";
        Vditor.md2html(vditor.getValue(), options).then((content) => {
            let html = "<html>"
                + "<head>"
                + "<meta charset=\"utf-8\" />"
                + "<link rel=\"stylesheet\" type=\"text/css\" href=\"" + options.cdn + "/dist/index.css\"/>"
                + "<script src=\"" + options.cdn + "/dist/js/i18n/" + options.lang + ".js\"><\/script>"
                + "<script src=\"" + options.cdn + "/dist/method.min.js\"><\/script>"
                + "</head>"
                + "<body style=\"width: 1075px;\">"
                + "<div class=\"vditor-reset\" id=\"preview\">" + content + "</div>"
                + "<script>"
                + "    const previewElement = document.getElementById('preview');"
                + "    Vditor.setContentTheme('" + options.theme.current + "', '" + options.theme.path + "');"
                + "    Vditor.codeRender(previewElement);"
                + "    Vditor.highlightRender(" + JSON.stringify(options.hljs) + ", previewElement, '" + options.cdn + "');"
                + "    Vditor.mathRender(previewElement, { cdn: '" + options.cdn + "',math: " + JSON.stringify(options.math) + "});"
                + "    Vditor.mermaidRender(previewElement, '" + options.cdn + "', '" + options.mode + "');"
                + "    Vditor.flowchartRender(previewElement, '" + options.cdn + "');"
                + "    Vditor.graphvizRender(previewElement, '" + options.cdn + "');"
                + "    Vditor.chartRender(previewElement, '" + options.cdn + "', '" + options.mode + "');"
                + "    Vditor.mindmapRender(previewElement, '" + options.cdn + "', '" + options.mode + "');"
                + "    Vditor.abcRender(previewElement, '" + options.cdn + "');"
                + "    Vditor.mediaRender(previewElement);"
                + "    Vditor.speechRender(previewElement);"
                + " <\/script> "
                + " <script src=\"" + options.cdn + "/dist/js/icons/" + options.icon + ".js\"><\/script>"
                + "</body></html>";

            $.post(exportUrl, {
                "value": html,
                "type": type,
                "cdn": options.cdn,
                "themeCdn": options.theme.path
            }, function (data) {
                if (data.success === false) {
                    vditor.tip("Failed to Export file", 0);
                }
            }).fail(function () {
                vditor.tip("Save file request error", 0);
            })
        });
    }

    function applyIdeaTheme() {
        if (!ideaThemeReady) {
            return;
        }
        vditor.setTheme(darcula ? "dark" : "light", darcula ? "idea-dark" : "idea-light", darcula ? "github-dark" : "github", vditorThemeCDN);
    }

    function syncIdeaTheme() {
        const style = document.getElementById("ideaStyle");
        if (style && /^\s*\.vditor(?:--dark)?\s*,\s*body\s*\{/.test(style.textContent)) {
            darcula = /^\s*\.vditor--dark\s*,\s*body\s*\{/.test(style.textContent);
        }
        applyIdeaTheme();
    }

    function applyAppearance() {
        const rawHtmlHidden = appearance.toolbarHidden || appearance.rawHtmlHidden;
        document.body.classList.toggle("markdown-toolbar-hidden", appearance.toolbarHidden);
        document.body.classList.toggle("markdown-raw-html-hidden", rawHtmlHidden);
        const visibility = document.getElementById("markdown-toolbar-visibility");
        if (visibility) {
            visibility.title = appearance.toolbarHidden ? "Show toolbar" : "Hide toolbar";
            visibility.setAttribute("aria-label", visibility.title);
            visibility.setAttribute("aria-expanded", String(!appearance.toolbarHidden));
        }
        document.querySelectorAll('[data-type="raw-html"]').forEach((button) => {
            button.setAttribute("aria-pressed", String(rawHtmlHidden));
            button.classList.toggle("vditor-icon--current", rawHtmlHidden);
            button.setAttribute("aria-label", rawHtmlHidden ? "Show raw HTML markup" : "Hide raw HTML markup");
        });
        if (rawHtmlHidden) {
            refreshHtmlOnlyRows();
        }
    }

    function toggleAppearance(key) {
        appearance[key] = !appearance[key];
        applyAppearance();
        jsSaveAppearance(appearance.toolbarHidden, appearance.rawHtmlHidden);
    }

    function initAppearance() {
        const visibility = document.createElement("button");
        visibility.id = "markdown-toolbar-visibility";
        visibility.type = "button";
        visibility.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v4H4zm0 7h4v7H4zm6 0h4v7h-4zm6 0h4v7h-4z" fill="currentColor"/></svg>';
        visibility.addEventListener("pointerdown", (event) => event.preventDefault());
        visibility.addEventListener("click", () => {
            const hiding = !appearance.toolbarHidden;
            toggleAppearance("toolbarHidden");
            if (hiding) {
                vditor.focus();
            }
        });
        document.getElementById("vditor").appendChild(visibility);

        let pendingRefresh = 0;
        refreshHtmlOnlyRows = () => {
            if (!document.body.classList.contains("markdown-raw-html-hidden") || pendingRefresh) {
                return;
            }
            pendingRefresh = requestAnimationFrame(() => {
                pendingRefresh = 0;
                document.querySelectorAll(".vditor-ir .vditor-reset > p, .vditor-wysiwyg .vditor-reset > p").forEach((paragraph) => {
                    const htmlOnly = Array.from(paragraph.childNodes).every((node) => {
                        if (node.nodeType === Node.TEXT_NODE) {
                            return !node.textContent.replace(/[\s\u200b]/g, "");
                        }
                        return node instanceof Element && node.matches('[data-type="html-inline"]');
                    }) && !!paragraph.querySelector('[data-type="html-inline"]');
                    paragraph.classList.toggle("markdown-html-only", htmlOnly);
                });
            });
        };
        const observer = new MutationObserver(refreshHtmlOnlyRows);
        observer.observe(document.getElementById("vditor"), {childList: true, subtree: true, characterData: true});
        applyAppearance();
    }

    function initResponsiveToolbar() {
        const toolbar = document.querySelector(".vditor-toolbar");
        if (!toolbar) {
            return;
        }
        toolbar.classList.add("markdown-toolbar");
        const controls = Array.from(toolbar.children).filter((child) =>
            child instanceof HTMLElement && !child.classList.contains("vditor-toolbar__br"));
        const overflow = document.createElement("div");
        overflow.className = "markdown-toolbar-overflow";
        const toggle = document.createElement("button");
        toggle.type = "button";
        toggle.className = "markdown-toolbar-toggle";
        toggle.textContent = "»";
        toggle.title = "More formatting tools";
        toggle.setAttribute("aria-label", toggle.title);
        toggle.setAttribute("aria-expanded", "false");
        const tray = document.createElement("div");
        tray.className = "markdown-toolbar-tray";
        tray.setAttribute("role", "group");
        tray.setAttribute("aria-label", toggle.title);
        tray.hidden = true;
        overflow.append(toggle, tray);
        toolbar.appendChild(overflow);
        const tooltip = document.createElement("div");
        tooltip.className = "markdown-toolbar-tooltip";
        tooltip.setAttribute("role", "tooltip");
        tooltip.hidden = true;
        document.body.appendChild(tooltip);

        function hideTooltip() {
            tooltip.hidden = true;
        }
        function showTooltip(event) {
            const target = event.target instanceof Element ? event.target.closest("button, [aria-label]") : null;
            if (!target || !toolbar.contains(target)) {
                return;
            }
            const label = target.getAttribute("aria-label") || target.title || target.textContent.trim();
            if (!label) {
                return;
            }
            tooltip.textContent = label;
            tooltip.hidden = false;
            const targetBounds = target.getBoundingClientRect();
            const tooltipBounds = tooltip.getBoundingClientRect();
            tooltip.style.left = Math.max(4, Math.min(targetBounds.left, window.innerWidth - tooltipBounds.width - 4)) + "px";
            tooltip.style.top = Math.min(targetBounds.bottom + 5, window.innerHeight - tooltipBounds.height - 4) + "px";
        }
        toolbar.addEventListener("pointerover", showTooltip);
        toolbar.addEventListener("focusin", showTooltip);
        toolbar.addEventListener("pointerout", hideTooltip);
        toolbar.addEventListener("focusout", hideTooltip);
        toolbar.addEventListener("pointerdown", hideTooltip);

        function close(returnFocus) {
            hideTooltip();
            tray.hidden = true;
            toggle.setAttribute("aria-expanded", "false");
            if (returnFocus) {
                toggle.focus();
            }
        }
        function controlName(control) {
            const button = control.querySelector("[data-type]");
            return button ? button.getAttribute("data-type") : control.id;
        }
        const priority = ["syncedTip", "reloadTip", "more", "edit-mode", "headings", "bold", "link", "italic"];
        function rank(control) {
            const index = priority.indexOf(controlName(control));
            return index < 0 ? priority.length : index;
        }
        function layout() {
            if (appearance.toolbarHidden) {
                return;
            }
            const focused = document.activeElement;
            controls.forEach((control) => toolbar.insertBefore(control, overflow));
            overflow.hidden = true;
            const style = getComputedStyle(toolbar);
            const available = toolbar.clientWidth - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight);
            const items = controls.filter((control) => !control.classList.contains("vditor-toolbar__divider"));
            const widths = new Map(items.map((control) => [control, control.getBoundingClientRect().width]));
            let width = items.reduce((total, control) => total + widths.get(control), 0);
            if (width > available) {
                overflow.hidden = false;
                width += overflow.getBoundingClientRect().width;
                const candidates = [...items].sort((left, right) =>
                    rank(right) - rank(left) || items.indexOf(right) - items.indexOf(left));
                const hidden = new Set();
                for (const control of candidates) {
                    if (width <= available) {
                        break;
                    }
                    hidden.add(control);
                    width -= widths.get(control);
                }
                items.filter((control) => hidden.has(control)).forEach((control) => tray.appendChild(control));
            } else {
                close(false);
            }
            if (focused instanceof HTMLElement && toolbar.contains(focused)) {
                if (tray.hidden && tray.contains(focused)) {
                    toggle.focus();
                } else {
                    focused.focus({preventScroll: true});
                }
            }
        }
        toggle.addEventListener("pointerdown", (event) => event.preventDefault());
        toggle.addEventListener("click", () => {
            tray.hidden = !tray.hidden;
            toggle.setAttribute("aria-expanded", String(!tray.hidden));
        });
        document.addEventListener("pointerdown", (event) => {
            if (event.target instanceof Node && !overflow.contains(event.target)) {
                close(false);
            }
        }, true);
        toolbar.addEventListener("keydown", (event) => {
            if (event.key === "Escape" && !tray.hidden) {
                event.preventDefault();
                event.stopImmediatePropagation();
                close(true);
            }
        }, true);
        tray.addEventListener("click", (event) => {
            if (!(event.target instanceof Element)) {
                return;
            }
            const item = event.target.closest(".vditor-toolbar__item");
            if (item && !item.querySelector(".vditor-panel")) {
                close(false);
            }
        });
        new ResizeObserver(layout).observe(toolbar);
        layout();
    }

    function headingText(heading) {
        const copy = heading.cloneNode(true);
        copy.querySelectorAll('[class*="vditor-ir__marker"]').forEach((marker) => marker.remove());
        return copy.textContent || "";
    }

    function headingSlug(text) {
        return text.trim().toLowerCase()
            .replace(/[^\p{L}\p{N}\p{M}_\- ]/gu, "")
            .replace(/ /g, "-");
    }

    function editorHeadings() {
        const mode = vditor.getCurrentMode();
        const root = document.querySelector(mode === "sv"
            ? ".vditor-preview .vditor-reset"
            : ".vditor-" + mode + " .vditor-reset");
        return root ? Array.from(root.querySelectorAll("h1,h2,h3,h4,h5,h6")) : [];
    }

    function scrollToHeading(fragment) {
        const target = decodeURIComponent(fragment);
        if (vditor.getCurrentMode() === "sv") {
            vditor.setPreviewMode("both");
            vditor.renderPreview();
        }
        const headings = editorHeadings();
        const used = new Set();
        let heading = headings.find((element) => {
            const base = headingSlug(headingText(element));
            let slug = base;
            let suffix = 0;
            while (used.has(slug)) {
                slug = base + "-" + ++suffix;
            }
            used.add(slug);
            return element.id === target || slug === target.toLowerCase();
        });
        if (!heading) {
            const mode = vditor.getCurrentMode();
            const root = document.querySelector(mode === "sv"
                ? ".vditor-preview .vditor-reset"
                : ".vditor-" + mode + " .vditor-reset");
            heading = root && Array.from(root.querySelectorAll("a[id], a[name]"))
                .find((element) => element.id === target || element.getAttribute("name") === target);
            if (!heading && root) {
                for (const element of root.querySelectorAll('[data-type="html-inline"]')) {
                    const template = document.createElement("template");
                    template.innerHTML = element.textContent.replace(/\u200b/g, "");
                    const matches = Array.from(template.content.querySelectorAll("a[id], a[name]"))
                        .some((anchor) => anchor.id === target || anchor.getAttribute("name") === target);
                    if (matches) {
                        heading = element.closest("p") || element;
                        break;
                    }
                }
            }
        }
        if (heading && !heading.getClientRects().length) {
            heading = heading.nextElementSibling || heading.parentElement;
        }
        if (!heading) {
            vditor.tip("Heading not found: " + fragment, 3000);
            return;
        }
        heading.scrollIntoView({block: "start", behavior: "smooth"});
    }

    function openMarkdownLink(element) {
        const href = element.getAttribute("href") || element.textContent.trim();
        if (href.startsWith("#")) {
            scrollToHeading(href.slice(1));
        } else {
            window.open(href);
        }
    }

    function initLinkEditing() {
        window.addEventListener("click", (event) => {
            if (!event.altKey || event.button !== 0 || !(event.target instanceof Element)) {
                return;
            }
            const link = event.target.closest('a, [data-type="a"]');
            if (!link || !link.closest(".vditor-content")) {
                return;
            }
            event.preventDefault();
            event.stopImmediatePropagation();
            const range = document.caretRangeFromPoint(event.clientX, event.clientY);
            if (range) {
                const selection = window.getSelection();
                selection.removeAllRanges();
                selection.addRange(range);
            }
        }, true);
    }

    document.addEventListener('keydown', fixListBackspace, true);

    const vditor = new Vditor('vditor', {
        "theme": darcula ? "dark" : "light",
        "height": document.documentElement.clientHeight,
        "lang": "{{Lang}}",
        "cache": {
            "enable": false
        },
        "link": {
            "isOpen": true,
            click: openMarkdownLink
        },
        "toolbar": [

            {"name": "bold", "tipPosition": "s"},
            {"name": "italic", "tipPosition": "s"},
            {"name": "strike", "tipPosition": "s"},
            {"name": "link", "tipPosition": "s"},
            "|",
            {"name": "list", "tipPosition": "s"},
            {"name": "ordered-list", "tipPosition": "s"},
            {"name": "check", "tipPosition": "s"},
            {"name": "outdent", "tipPosition": "s"},
            {"name": "indent", "tipPosition": "s"},
            "|",
            {"name": "quote", "tipPosition": "s"},
            {"name": "line", "tipPosition": "s"},
            {"name": "code", "tipPosition": "s"},
            {"name": "inline-code", "tipPosition": "s"},
            {"name": "insert-before", "tipPosition": "s"},
            {"name": "insert-after", "tipPosition": "s"},
            {"name": "table", "tipPosition": "s"},
            {"name": "upload", "tipPosition": "s"},
            "|",
            {"name": "undo", "tipPosition": "s"},
            {"name": "redo", "tipPosition": "s"},
            "|",
            {"name": "edit-mode", "tipPosition": "w"},
            {
                "name": "raw-html",
                "tip": "Hide raw HTML markup (rich editing modes only)",
                "tipPosition": "s",
                "icon": '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5-7 7 7 7 2-2-5-5 5-5zm8 0-2 2 5 5-5 5 2 2 7-7z" fill="currentColor"/></svg>',
                click() {
                    toggleAppearance("rawHtmlHidden");
                }
            },
            {
                "name": "donate",
                "tip": "donate",
                "tipPosition": "s",
                "icon": document.getElementById("donate").innerHTML,
                click() {
                    window.open("https://shuzijun.com/donate.html");
                }
            },
            {
                name: "more",
                toolbar: [
                    "both",
                    "code-theme",
                    "content-theme",
                    "outline",
                    "preview",
                    "devtools",
                    "export",
                    "info"
                ],
            },
        ],
        "toolbarConfig": {"pin": true},
        "cdn": vditorCDN,
        "preview": {
            "theme": {
                "current": darcula ? "idea-dark" : "idea-light",
                "path": vditorThemeCDN
            },
            "markdown": {
                "sanitize": false
            },
            "maxWidth": Math.min(Math.max($(window).width() - 100, 720), 1080),
            "actions": ["desktop", "tablet", "mobile"],
            "hljs": {"style": darcula ? "github-dark" : "github"},
            "math": {
                "inlineDigit": true
            }
        },
        "counter": {
            "enable": true
        },
        "upload": {
            "url": uploadUrl,
            format(files, responseText) {
                saveTime = 0;
                return responseText;
            }
        },
        "value": initValue(),
        after() {
            fileValue = vditor.getValue();
            ideaThemeReady = true;
            setTimeout(syncIdeaTheme, 0);
        },
        blur(md) {
            editBlur(md,false)
        },
        focus(md) {
            editFocus(md)
        },
        input(md) {
            editInput(md)
        }
    });

    function updateStyle(style, darkTheme) {
        let newStyle = document.createElement('style');
        newStyle.id = 'ideaStyle';
        newStyle.textContent = style;
        let oldStyle = document.getElementById('ideaStyle');
        if (oldStyle) {
            oldStyle.parentNode.replaceChild(newStyle, oldStyle);
        } else {
            document.head.appendChild(newStyle);
        }
        darcula = darkTheme;
        applyIdeaTheme();
    }

    const ideaStyleObserver = new MutationObserver((records) => {
        if (records.some((record) => record.target.id === "ideaStyle" ||
            (record.target.parentElement && record.target.parentElement.id === "ideaStyle") ||
            Array.from(record.addedNodes).some((node) => node.id === "ideaStyle"))) {
            syncIdeaTheme();
        }
    });
    ideaStyleObserver.observe(document.documentElement, {childList: true, subtree: true, characterData: true});
    document.addEventListener("visibilitychange", () => {
        if (!document.hidden) {
            syncIdeaTheme();
        }
    });
    window.addEventListener("pageshow", syncIdeaTheme);


    function updateHeight(width, height) {
        // The toolbar is pinned to the editor top; padding the whole editor by
        // the host/webview height difference creates a blank strip above it.
        document.getElementById('vditor').style.paddingTop = "0";
    }
